<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Free Particle Motion on Surfaces</title>
    <style>
        :root {
            --bg: #fff;
            --fg: #1c1c1e;
            --mut: #666b73;
            --sf: #f2f3f5;
            --bd: #d6d9de;
            --ac: #2563eb;
            --wire: #8b94a5;
            --tr: #e2530f;
            --pt: #111;
            --ptb: #fff;
            color-scheme: light;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #121316;
                --fg: #ececef;
                --mut: #9aa0aa;
                --sf: #1c1e23;
                --bd: #33363d;
                --ac: #6ea0ff;
                --wire: #6d7585;
                --tr: #ff8a4c;
                --pt: #fff;
                --ptb: #121316;
                color-scheme: dark
            }
        }

        :root[data-theme="dark"] {
            --bg: #121316;
            --fg: #ececef;
            --mut: #9aa0aa;
            --sf: #1c1e23;
            --bd: #33363d;
            --ac: #6ea0ff;
            --wire: #6d7585;
            --tr: #ff8a4c;
            --pt: #fff;
            --ptb: #121316;
            color-scheme: dark
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0
        }

        body {
            background: var(--bg);
            color: var(--fg);
            font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
            padding: 12px;
            max-width: 1000px;
            margin: 0 auto
        }

        h1 {
            font-size: 18px;
            margin: 2px 0 10px
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 10px
        }

        .tabs button {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--bd);
            background: var(--sf);
            color: var(--fg);
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600
        }

        .tabs button.on {
            background: var(--ac);
            border-color: var(--ac);
            color: #fff
        }

        .wrap {
            display: grid;
            gap: 12px
        }

        @media(min-width:800px) {
            .wrap {
                grid-template-columns: 1.1fr 1fr
            }
        }

        canvas {
            width: 100%;
            aspect-ratio: 1;
            background: var(--sf);
            border: 1px solid var(--bd);
            border-radius: 12px;
            touch-action: none;
            display: block;
            max-height: 75vh
        }

        .hint {
            font-size: 12px;
            color: var(--mut);
            margin: 4px 2px 0
        }

        .card {
            background: var(--sf);
            border: 1px solid var(--bd);
            border-radius: 12px;
            padding: 10px 12px;
            margin-bottom: 10px
        }

        .card h2 {
            font-size: 13px;
            margin: 0 0 6px;
            color: var(--mut);
            text-transform: uppercase;
            letter-spacing: .04em
        }

        .row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap
        }

        .btn {
            padding: 8px 14px;
            border: 1px solid var(--bd);
            background: var(--bg);
            color: var(--fg);
            border-radius: 8px;
            font-size: 14px
        }

        .pre {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px
        }

        .pre button {
            white-space: nowrap;
            padding: 6px 10px;
            border: 1px solid var(--ac);
            background: transparent;
            color: var(--ac);
            border-radius: 16px;
            font-size: 13px
        }

        .s {
            margin: 8px 0
        }

        .s label {
            display: flex;
            justify-content: space-between;
            font-size: 14px
        }

        .s b {
            font-variant-numeric: tabular-nums
        }

        input[type=range] {
            width: 100%;
            accent-color: var(--ac);
            margin: 2px 0
        }

        .eq {
            font-family: ui-monospace, Menlo, monospace;
            font-size: 13px;
            color: var(--mut);
            margin-bottom: 6px
        }

        #info div {
            margin: 2px 0
        }

        #live {
            font-family: ui-monospace, Menlo, monospace;
            font-size: 13px;
            margin-top: 6px;
            color: var(--ac)
        }
    </style>
</head>

<body>
    <h1>Free Particle Motion on Surfaces</h1>
    <div class="tabs" id="tabs">
        <button data-s="cone" class="on">Cone</button><button data-s="sphere">Sphere</button><button
            data-s="torus">Torus</button>
    </div>
    <div class="wrap">
        <div><canvas id="canvas"></canvas>
            <div class="hint">Drag to rotate the view. Orange = path, ring = start point.</div>
        </div>
        <div>
            <div class="card">
                <h2>Simulation</h2>
                <div class="row"><button class="btn" id="play">Pause</button><button class="btn"
                        id="rst">Restart</button>
                    <label style="flex:1;min-width:140px;font-size:14px">Time scale <b id="spv">1×</b><input
                            type="range" id="sp" min="0.1" max="4" step="0.1" value="1"></label>
                </div>
            </div>
            <div class="card">
                <h2>Presets</h2>
                <div class="pre" id="pre"></div>
            </div>
            <div class="card">
                <h2>Parameters (m = 1)</h2>
                <div id="ctl"></div>
            </div>
            <div class="card">
                <h2>Motion analysis</h2>
                <div class="eq" id="eq"></div>
                <div id="info"></div>
                <div id="live"></div>
            </div>
        </div>
    </div>
    <script>
        const DEG_TO_RAD = Math.PI / 180;
        const RAD_TO_DEG = 180 / Math.PI;
        const CONE_HEIGHT = 12;
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let surfaceType = 'cone';
        let params = {}, sim = {}, trajectory = [];
        let isRunning = true, timeScale = 1;
        let rotX = 0.7, rotY = 0.45;

        const paramConfigs = {
            cone: [
                ['alpha', 'Half-angle α', '°', 10, 80, 1, 30],
                ['r0', 'Initial distance r₀', '', 0.5, 8, 0.1, 4],
                ['vr', 'Radial velocity ṙ₀', '', -3, 3, 0.05, 0],
                ['vt', 'Tangential speed r₀ sinα φ̇₀', '', -3, 3, 0.05, 1]
            ],
            sphere: [
                ['R', 'Radius R', '', 1, 3, 0.1, 2],
                ['theta', 'Polar angle θ₀', '°', 0, 180, 1, 60],
                ['phi', 'Azimuth φ₀', '°', 0, 360, 1, 0],
                ['v', 'Initial speed v₀', '', 0, 4, 0.05, 1],
                ['beta', 'Launch angle β (0° east, 90° north)', '°', 0, 360, 1, 0]
            ],
            torus: [
                ['R', 'Major radius R', '', 1.5, 4, 0.1, 3],
                ['a', 'Minor radius a', '', 0.3, 3.8, 0.05, 1],
                ['theta', 'Poloidal angle θ₀', '°', 0, 360, 1, 0],
                ['phi', 'Toroidal angle φ₀', '°', 0, 360, 1, 0],
                ['thetaDot', 'Initial θ̇₀', '', -8, 8, 0.01, 0.5],
                ['phiDot', 'Initial φ̇₀', '', -4, 4, 0.01, 1]
            ]
        };

        const presets = {
            cone: {
                'Fall to apex': { alpha: 30, r0: 6, vr: -1.5, vt: 0 },
                'Near miss': { r0: 5, vr: -1.5, vt: 0.6 },
                'Tangential start': { vr: 0, vt: 1 },
                'Outward drift': { vr: 2, vt: 0.4 },
                'Sharp cone': { alpha: 12, r0: 3, vr: -1, vt: 1.2 },
                'Wide cone': { alpha: 75, r0: 4, vr: -1, vt: 1 }
            },
            sphere: {
                'Equator': { theta: 90, beta: 0 },
                'Meridian (poles)': { theta: 60, beta: 90 },
                'Tilted circle': { theta: 60, v: 1.2, beta: 45 },
                'East from θ=60°': { theta: 60, beta: 0 },
                'At rest': { v: 0 }
            },
            torus: {
                'Outer circular': { thetaDot: 0, phiDot: 1 },
                'Libration': { thetaDot: 0.5, phiDot: 1 },
                'Near separatrix': { thetaDot: 2.08, phiDot: 0.3 },
                'Inner equator': { theta: 180, thetaDot: 0, phiDot: 1 },
                'Circulating': { thetaDot: 4, phiDot: 0.5 },
                'Meridian only (ℓ=0)': { thetaDot: 1.5, phiDot: 0 }
            }
        };

        function round(val, dec = 2) {
            return Number(val.toFixed(dec));
        }

        function generateCircle(pointFn, steps = 64) {
            const points = [];
            for (let i = 0; i <= steps; i++) {
                points.push(pointFn((i / steps) * 2 * Math.PI));
            }
            return points;
        }

        function resetSimulation() {
            trajectory = [];
            sim = { t: 0, pauseHold: 0, wireframe: [], greatCircle: null, maxDt: 0.02 };
            if (surfaceType === 'cone') {
                const alphaRad = params.alpha * DEG_TO_RAD;
                const sinA = Math.sin(alphaRad), cosA = Math.cos(alphaRad);
                const vSq = params.vr * params.vr + params.vt * params.vt;
                sim.viewBound = Math.hypot(CONE_HEIGHT * cosA / 2, CONE_HEIGHT * sinA) * 1.05;
                sim.zOffset = CONE_HEIGHT * cosA / 2;
                sim.getPosition = () => {
                    const flatX = params.r0 + params.vr * sim.t;
                    const flatY = params.vt * sim.t;
                    const r = Math.hypot(flatX, flatY);
                    const flatAngle = (params.vt === 0) ? (flatX >= 0 ? 0 : Math.PI) : Math.atan2(flatY, flatX);
                    const phi = flatAngle / sinA;
                    sim.currentR = r; sim.currentPhi = phi;
                    return [r * sinA * Math.cos(phi), r * sinA * Math.sin(phi), r * cosA];
                };
                sim.stepPhysics = () => {};
                for (let i = 0; i < 12; i++) {
                    const phi = i * 30 * DEG_TO_RAD;
                    sim.wireframe.push([[0, 0, 0], [CONE_HEIGHT * sinA * Math.cos(phi), CONE_HEIGHT * sinA * Math.sin(phi), CONE_HEIGHT * cosA]]);
                }
                for (let j = 1; j <= 4; j++) {
                    const r = CONE_HEIGHT * j / 4;
                    sim.wireframe.push(generateCircle(angle => [r * sinA * Math.cos(angle), r * sinA * Math.sin(angle), r * cosA]));
                }

                sim.equationText = 'r̈ = r sin²α φ̇² ,  Jz = r² sin²α φ̇ = const';
                const Jz = sinA * params.r0 * params.vt;
                const rMin = vSq > 0 ? (params.vr < 0 ? params.r0 * Math.abs(params.vt) / Math.sqrt(vSq) : params.r0) : params.r0;
                let note = 'Particle moves along geodesic (straight line on unrolled surface).';
                if (!vSq) note = 'At rest: stays at initial position.';
                else if (params.vt === 0) note = params.vr < 0 ? 'Pure radial inward: runs into apex.' : 'Pure radial outward: escapes along generator.';
                else if (params.vr < 0) note = 'Inward flight turns at centrifugal barrier r_min, then escapes.';
                sim.infoText = ['Total Energy E = ' + round(0.5 * vSq), 'Angular momentum Jz = ' + round(Jz) + (params.vt === 0 ? ' (zero barrier)' : ''), 'Closest approach r_min = ' + round(rMin), note];
                sim.getLiveStatus = () => {
                    const phiDeg = ((sim.currentPhi * RAD_TO_DEG) % 360 + 360) % 360;
                    return 't = ' + round(sim.t, 1) + ' s   r = ' + round(sim.currentR) + '   φ = ' + round(phiDeg, 0) + '°';
                };
            }

            if (surfaceType === 'sphere') {
                const R = params.R;
                const th = params.theta * DEG_TO_RAD, ph = params.phi * DEG_TO_RAD, beta = params.beta * DEG_TO_RAD;
                const normal = [Math.sin(th) * Math.cos(ph), Math.sin(th) * Math.sin(ph), Math.cos(th)];
                const southTangent = [Math.cos(th) * Math.cos(ph), Math.cos(th) * Math.sin(ph), -Math.sin(th)];
                const eastTangent = [-Math.sin(ph), Math.cos(ph), 0];
                const unitVelocity = [0, 1, 2].map(i => Math.cos(beta) * eastTangent[i] - Math.sin(beta) * southTangent[i]);
                const L = [
                    normal[1] * unitVelocity[2] - normal[2] * unitVelocity[1],
                    normal[2] * unitVelocity[0] - normal[0] * unitVelocity[2],
                    normal[0] * unitVelocity[1] - normal[1] * unitVelocity[0]
                ];
                sim.viewBound = R * 1.1; sim.zOffset = 0;
                sim.getPosition = () => {
                    const omega = params.v / R, cosW = Math.cos(omega * sim.t), sinW = Math.sin(omega * sim.t);
                    const pos = [0, 1, 2].map(i => R * (cosW * normal[i] + sinW * unitVelocity[i]));
                    sim.currentPos = pos;
                    return pos;
                };
                sim.stepPhysics = () => {};
                for (let i = 0; i < 6; i++) {
                    const p = i * 30 * DEG_TO_RAD;
                    sim.wireframe.push(generateCircle(angle => [R * Math.sin(angle) * Math.cos(p), R * Math.sin(angle) * Math.sin(p), R * Math.cos(angle)]));
                }
                for (let j = 1; j <= 5; j++) {
                    const t = j * 30 * DEG_TO_RAD;
                    sim.wireframe.push(generateCircle(angle => [R * Math.sin(t) * Math.cos(angle), R * Math.sin(t) * Math.sin(angle), R * Math.cos(t)]));
                }

                sim.greatCircle = params.v > 0 ? generateCircle(angle => [0, 1, 2].map(i => R * (Math.cos(angle) * normal[i] + Math.sin(angle) * unitVelocity[i]))) : null;
                sim.equationText = 'θ̈ = sinθ cosθ φ̇² ,  L = r × p = const';
                const inclination = Math.acos(Math.min(1, Math.abs(L[2]))) * RAD_TO_DEG;
                const period = params.v > 0 ? 2 * Math.PI * R / params.v : 0;
                sim.infoText = [
                    'Orbit plane tilt = ' + round(inclination, 1) + '° (angle between L and z-axis)',
                    'Angular momentum |L| = ' + round(R * params.v) + '   L̂ = (' + L.map(x => round(x)).join(', ') + ')',
                    'Speed v = ' + round(params.v) + (params.v > 0 ? '   Period T = ' + round(period) + ' s' : ' (at rest)'),
                    'Geodesics on a sphere are great circles.'
                ];
                sim.getPosition();
                sim.getLiveStatus = () => {
                    const p = sim.currentPos;
                    const thDeg = Math.acos(Math.max(-1, Math.min(1, p[2] / R))) * RAD_TO_DEG;
                    const phDeg = ((Math.atan2(p[1], p[0]) * RAD_TO_DEG) % 360 + 360) % 360;
                    return 't = ' + round(sim.t, 1) + ' s   θ = ' + round(thDeg, 0) + '°   φ = ' + round(phDeg, 0) + '°';
                };
            }

            if (surfaceType === 'torus') {
                const R = params.R, a = params.a;
                const theta0 = params.theta * DEG_TO_RAD, phi0 = params.phi * DEG_TO_RAD;
                const thetaDot0 = params.thetaDot, phiDot0 = params.phiDot;
                const ell = Math.pow(R + a * Math.cos(theta0), 2) * phiDot0;
                const ellSq = ell * ell;
                const totalEnergy = 0.5 * a * a * thetaDot0 * thetaDot0 + ellSq / (2 * Math.pow(R + a * Math.cos(theta0), 2));
                const vMin = ellSq / (2 * Math.pow(R + a, 2)), vMax = ellSq / (2 * Math.pow(R - a, 2));
                sim.viewBound = (R + a) * 1.08; sim.zOffset = 0; sim.maxDt = 0.004;
                sim.state = [theta0, thetaDot0, phi0];
                const thetaAccel = th => -ellSq * Math.sin(th) / (a * Math.pow(R + a * Math.cos(th), 3));
                const phiRate = th => ell / Math.pow(R + a * Math.cos(th), 2);
                sim.stepPhysics = dt => {
                    let [th, w, ph] = sim.state;
                    const k1_th = w, k1_w = thetaAccel(th);
                    const k2_th = w + 0.5 * dt * k1_w, k2_w = thetaAccel(th + 0.5 * dt * k1_th);
                    const k3_th = w + 0.5 * dt * k2_w, k3_w = thetaAccel(th + 0.5 * dt * k2_th);
                    const k4_th = w + dt * k3_w, k4_w = thetaAccel(th + dt * k3_th);
                    ph += (dt / 6) * (phiRate(th) + 2 * phiRate(th + 0.5 * dt * k1_th) + 2 * phiRate(th + 0.5 * dt * k2_th) + phiRate(th + dt * k3_th));
                    th += (dt / 6) * (k1_th + 2 * k2_th + 2 * k3_th + k4_th);
                    w += (dt / 6) * (k1_w + 2 * k2_w + 2 * k3_w + k4_w);
                    sim.state = [th, w, ph];
                };

                sim.getPosition = () => {
                    const [th, , ph] = sim.state, rZ = R + a * Math.cos(th);
                    return [rZ * Math.cos(ph), rZ * Math.sin(ph), a * Math.sin(th)];
                };

                for (let i = 0; i < 12; i++) {
                    const ph = i * 30 * DEG_TO_RAD;
                    sim.wireframe.push(generateCircle(angle => [(R + a * Math.cos(angle)) * Math.cos(ph), (R + a * Math.cos(angle)) * Math.sin(ph), a * Math.sin(angle)]));
                }
                for (let j = 0; j < 12; j++) {
                    const th = j * 30 * DEG_TO_RAD;
                    sim.wireframe.push(generateCircle(angle => [(R + a * Math.cos(th)) * Math.cos(angle), (R + a * Math.cos(th)) * Math.sin(angle), a * Math.sin(th)]));
                }
                sim.equationText = 'θ̈ = −ℓ² sinθ / [a(R + a cosθ)³] ,  φ̇ = ℓ / (R + a cosθ)²';
                let regime = 'V_min < E < V_max: Libration (oscillates between turning points around outer equator).';
                if (Math.abs(ell) < 1e-8) regime = 'ℓ = 0: Pure meridian motion around tube.';
                else if (totalEnergy >= vMax) regime = 'E ≥ V_max: Circulation (winds indefinitely around tube).';
                sim.infoText = ['Energy E = ' + round(totalEnergy) + '   Toroidal momentum ℓ = ' + round(ell), 'Potential barriers: V_min = ' + round(vMin) + ', V_max = ' + round(vMax), regime];
                sim.getLiveStatus = () => {
                    const thDeg = ((sim.state[0] * RAD_TO_DEG) % 360 + 360) % 360;
                    const phDeg = ((sim.state[2] * RAD_TO_DEG) % 360 + 360) % 360;
                    return 't = ' + round(sim.t, 1) + ' s   θ = ' + round(thDeg, 0) + '°   φ = ' + round(phDeg, 0) + '°';
                };
            }
            trajectory.push(sim.getPosition());
            document.getElementById('eq').textContent = sim.equationText;
            document.getElementById('info').innerHTML = sim.infoText.map(txt => '<div>' + txt + '</div>').join('');
        }

        function createControls() {
            const container = document.getElementById('ctl');
            container.innerHTML = '';
            paramConfigs[surfaceType].forEach(([key, label, unit, minVal, maxVal, step, defaultVal]) => {
                if (params[key] === undefined) params[key] = defaultVal;
                if (surfaceType === 'torus' && key === 'a') maxVal = round(params.R - 0.2);
                const item = document.createElement('div');
                item.className = 's';
                item.innerHTML = '<label>' + label + '<b id="val_' + key + '">' + round(params[key]) + unit + '</b></label>' + '<input type="range" id="param_' + key + '" min="' + minVal + '" max="' + maxVal + '" step="' + step + '" value="' + params[key] + '">';
                container.appendChild(item);
            });

            const presetContainer = document.getElementById('pre');
            presetContainer.innerHTML = '';
            const surfacePresets = presets[surfaceType];
            Object.keys(surfacePresets).forEach(name => {
                const btn = document.createElement('button');
                btn.textContent = name;
                btn.onclick = () => {
                    params = Object.assign({}, loadDefaultParams(), surfacePresets[name]);
                    if (surfaceType === 'torus' && surfacePresets[name].R === undefined) params.R = 3;
                    createControls();
                    resetSimulation();
                };
                presetContainer.appendChild(btn);
            });
        }

        function loadDefaultParams() {
            const defaults = {};
            paramConfigs[surfaceType].forEach(([key, , , , , , defaultVal]) => {
                defaults[key] = defaultVal;
            });
            return defaults;
        }

        document.getElementById('ctl').addEventListener('input', e => {
            const inputId = e.target.id;
            if (!inputId.startsWith('param_')) return;
            const key = inputId.replace('param_', '');
            params[key] = Number(e.target.value);
            const config = paramConfigs[surfaceType].find(item => item[0] === key);
            document.getElementById('val_' + key).textContent = round(params[key]) + config[2];
            if (surfaceType === 'torus' && key === 'R') {
                const maxAllowedA = round(params.R - 0.2);
                const aInput = document.getElementById('param_a');
                aInput.max = maxAllowedA;
                if (params.a > maxAllowedA) {
                    params.a = maxAllowedA;
                    aInput.value = maxAllowedA;
                    document.getElementById('val_a').textContent = round(maxAllowedA);
                }
            }
            resetSimulation();
        });
        document.getElementById('tabs').addEventListener('click', e => {
            const selected = e.target.dataset.s;
            if (!selected) return;
            surfaceType = selected;
            document.querySelectorAll('#tabs button').forEach(btn => btn.classList.toggle('on', btn.dataset.s === selected));
            params = loadDefaultParams();
            createControls();
            resetSimulation();
        });
        document.getElementById('play').onclick = () => {
            isRunning = !isRunning;
            document.getElementById('play').textContent = isRunning ? 'Pause' : 'Play';
        };
        document.getElementById('rst').onclick = () => resetSimulation();
        document.getElementById('sp').oninput = e => {
            timeScale = Number(e.target.value);
            document.getElementById('spv').textContent = timeScale + '×';
        };

        let dragStart = null;
        canvas.addEventListener('pointerdown', e => {
            dragStart = [e.clientX, e.clientY];
            canvas.setPointerCapture(e.pointerId);
        });
        canvas.addEventListener('pointermove', e => {
            if (!dragStart) return;
            rotX += (e.clientX - dragStart[0]) * 0.01;
            rotY = Math.max(-1.5, Math.min(1.5, rotY + (e.clientY - dragStart[1]) * 0.01));
            dragStart = [e.clientX, e.clientY];
        });
        canvas.addEventListener('pointerup', () => { dragStart = null; });
        canvas.addEventListener('pointercancel', () => { dragStart = null; });

        function updatePhysics(dt) {
            const steps = Math.max(1, Math.ceil(Math.abs(dt) / sim.maxDt));
            const subDt = dt / steps;
            for (let i = 0; i < steps; i++) {
                sim.t += subDt;
                sim.stepPhysics(subDt);
                trajectory.push(sim.getPosition());
            }
            if (trajectory.length > 5000) trajectory.splice(0, trajectory.length - 5000);
            if (surfaceType === 'cone' && sim.currentR > CONE_HEIGHT) sim.pauseHold = 0.8;
        }

        function renderScene() {
            const width = canvas.clientWidth, height = canvas.clientHeight;
            const dpr = window.devicePixelRatio || 1;
            if (canvas.width !== Math.round(width * dpr)) {
                canvas.width = Math.round(width * dpr);
                canvas.height = Math.round(height * dpr);
            }
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, width, height);
            const style = getComputedStyle(document.documentElement);
            const getVar = name => style.getPropertyValue(name).trim();
            const scale = 0.46 * Math.min(width, height) / sim.viewBound;
            const cosRotX = Math.cos(rotX), sinRotX = Math.sin(rotX);
            const cosRotY = Math.cos(rotY), sinRotY = Math.sin(rotY);
            const zOff = sim.zOffset || 0;
            function project(p3d) {
                const z = p3d[2] - zOff;
                const xRot = p3d[0] * cosRotX - p3d[1] * sinRotX;
                const yRot = p3d[0] * sinRotX + p3d[1] * cosRotX;
                return [width / 2 + scale * xRot, height / 2 - scale * (z * cosRotY - yRot * sinRotY)];
            }

            function drawCurve(points, color, alpha, lineWidth) {
                if (!points || points.length === 0) return;
                ctx.beginPath();
                points.forEach((pt, i) => {
                    const screenPt = project(pt);
                    if (i === 0) ctx.moveTo(screenPt[0], screenPt[1]);
                    else ctx.lineTo(screenPt[0], screenPt[1]);
                });
                ctx.strokeStyle = color;
                ctx.globalAlpha = alpha;
                ctx.lineWidth = lineWidth;
                ctx.stroke();
                ctx.globalAlpha = 1;
            }
            sim.wireframe.forEach(wire => drawCurve(wire, getVar('--wire'), 0.5, 1));
            drawCurve([[0, 0, -sim.viewBound * 0.9 + zOff], [0, 0, sim.viewBound * 0.9 + zOff]], getVar('--wire'), 0.35, 1);
            if (sim.greatCircle) drawCurve(sim.greatCircle, getVar('--ac'), 0.6, 1.5);
            const totalPts = trajectory.length;
            const segments = Math.min(24, totalPts - 1);
            for (let k = 0; k < segments; k++) {
                const a = Math.floor(k * (totalPts - 1) / segments);
                const b = Math.floor((k + 1) * (totalPts - 1) / segments) + 1;
                drawCurve(trajectory.slice(a, Math.min(b + 1, totalPts)), getVar('--tr'), 0.2 + 0.8 * (k + 1) / segments, 2);
            }

            if (totalPts > 0) {
                const startPt = project(trajectory[0]);
                ctx.beginPath();
                ctx.arc(startPt[0], startPt[1], 5, 0, 2 * Math.PI);
                ctx.strokeStyle = getVar('--tr');
                ctx.lineWidth = 2;
                ctx.stroke();
                const currentPt = project(trajectory[totalPts - 1]);
                ctx.beginPath();
                ctx.arc(currentPt[0], currentPt[1], 6.5, 0, 2 * Math.PI);
                ctx.fillStyle = getVar('--pt');
                ctx.fill();
                ctx.strokeStyle = getVar('--ptb');
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }
        let lastTime = performance.now();
        function loop(now) {
            const dt = Math.min(0.05, (now - lastTime) / 1000);
            lastTime = now;
            if (sim.pauseHold > 0) {
                sim.pauseHold -= dt;
                if (sim.pauseHold <= 0) resetSimulation();
            } else if (isRunning) {
                updatePhysics(dt * timeScale);
            }
            renderScene();
            document.getElementById('live').textContent = sim.getLiveStatus();
            requestAnimationFrame(loop);
        }
        params = loadDefaultParams();
        createControls();
        resetSimulation();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
